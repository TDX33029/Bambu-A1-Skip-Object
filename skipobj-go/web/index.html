<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拓竹跳过对象工具(Go 版)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #1f2430; color: #fff; padding: 10px 16px; font-size: 15px; display: flex; gap: 14px; align-items: center; }
  header b { color: #7fd88f; }
  main { max-width: 1180px; margin: 12px auto; padding: 0 12px; display: flex; flex-direction: column; gap: 10px; }
  section { background: #fff; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h2 { font-size: 14px; margin: 0 0 8px; color: #555; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  label.dim { color: #777; font-size: 13px; }
  input, select, button { font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 1px solid #ccd; background: #fff; }
  button { cursor: pointer; background: #2b6cb0; color: #fff; border: none; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button.ghost { background: #e2e8f0; color: #333; }
  button.danger { background: #c0392b; }
  button.go { background: #1e8e3e; font-weight: 600; }
  .stat { display: flex; flex-wrap: wrap; gap: 6px 22px; }
  .stat span.k { color: #888; font-size: 13px; margin-right: 4px; }
  .stat span.v { font-weight: 600; }
  .cols { display: flex; gap: 12px; align-items: stretch; }
  .imgbox { width: 430px; flex: 0 0 430px; }
  canvas { background: #0a0a0a; border: 1px solid #444; border-radius: 6px; width: 428px; }
  .objlist { flex: 1; max-height: 470px; overflow-y: auto; border: 1px solid #e2e2e2; border-radius: 6px; padding: 4px 8px; }
  .objlist label { display: block; padding: 3px 2px; border-bottom: 1px dashed #eee; cursor: pointer; }
  .objlist label.sel { background: #e8f7ee; }
  #log { background: #101410; color: #9f9; font-family: Consolas, monospace; font-size: 12px;
         height: 150px; overflow-y: auto; padding: 8px; white-space: pre-wrap; border-radius: 6px; }
  .hint { color: #999; font-size: 12px; }
  .ok { color: #1e8e3e; } .bad { color: #c0392b; }
</style>
</head>
<body>
<header>拓竹跳过对象工具 <b id="ver"></b><span style="opacity:.7;font-size:12px">协议逆向自 Bambu Handy</span></header>
<main>

<section>
  <h2>1. 连接</h2>
  <div class="row" id="credInfo" class="hint"></div>
  <div class="row" style="margin-top:6px">
    <label class="dim"><input type="radio" name="mode" value="cloud" checked> 云端</label>
    <select id="snSel" style="min-width:220px"></select>
    <label class="dim"><input type="radio" name="mode" value="lan"> 局域网</label>
    <span class="dim">IP</span><input id="ip" size="14" placeholder="192.168.x.x">
    <span class="dim">访问码</span><input id="code" size="9" type="password">
    <button id="btnConn" onclick="toggleConn()">连接</button>
    <span id="connState" class="hint"></span>
  </div>
</section>

<section>
  <h2>2. 打印状态</h2>
  <div class="stat">
    <span><span class="k">状态</span><span class="v" id="s_state">-</span></span>
    <span><span class="k">任务</span><span class="v" id="s_task">-</span></span>
    <span><span class="k">层号</span><span class="v" id="s_layer">-</span></span>
    <span><span class="k">进度</span><span class="v" id="s_pct">-</span></span>
    <span><span class="k">已跳过</span><span class="v" id="s_skip">-</span></span>
    <span><span class="k">任务ID</span><span class="v" id="s_tid">-</span></span>
  </div>
</section>

<section>
  <h2>3. 要跳过的零件(俯视图上点击零件即可选中 —— 与 Handy 同款颜色编码遮罩)</h2>
  <div class="row">
    <button id="btnFetch" onclick="doFetch()" disabled>从云端任务获取</button>
    <label class="ghost" style="padding:6px 10px;border-radius:6px;background:#e2e8f0;cursor:pointer">
      打开切片 3mf…<input type="file" id="f3mf" accept=".3mf" style="display:none"></label>
    <select id="plateSel" style="min-width:260px" onchange="renderPlate()"></select>
    <button class="ghost" onclick="setAll(true)">全选</button>
    <button class="ghost" onclick="setAll(false)">清空</button>
    <label class="dim"><input type="radio" name="view" value="pick" checked onchange="showImg()"> 选择视图(可点击)</label>
    <label class="dim"><input type="radio" name="view" value="top" onchange="showImg()"> 渲染图(预览)</label>
  </div>
  <div class="cols" style="margin-top:8px">
    <div class="imgbox">
      <canvas id="plate" width="428" height="428"></canvas>
      <div class="hint">黑色区域为空白热床;点击零件切换选中(绿圈),与右侧列表联动</div>
    </div>
    <div class="objlist" id="objlist"><div class="hint" style="padding:8px">尚未加载零件列表</div></div>
  </div>
</section>

<section>
  <h2>4. 发送跳过命令</h2>
  <div class="row">
    <span class="dim">手动 ID(逗号分隔)</span>
    <input id="manual" size="20" placeholder="如 197,175">
    <label class="dim"><input type="checkbox" id="legacy"> 旧协议(Studio 格式)</label>
    <span style="flex:1"></span>
    <button class="ghost" id="btnManual" onclick="sendManual()" disabled>跳过手动输入</button>
    <button class="go" id="btnSkip" onclick="sendSelected()" disabled>跳过选中零件</button>
  </div>
  <div class="hint" style="margin-top:6px">请确认打印进行中(RUNNING/暂停);跳过已开始的零件不可撤销。</div>
</section>

<section>
  <h2>MQTT 日志</h2>
  <div id="log"></div>
</section>

</main>
<script>
const $ = id => document.getElementById(id);
let state = {connected:false, creds:null, report:null, plates:[]};
let selected = new Set();          // identify_id -> 选中
let curPlateIdx = null;
let lastSeq = 0, reported = new Set();
let lastClick = {};                // iid -> {x,y}

async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) throw new Error((await r.text()) || r.status);
}
async function pollState() {
  try {
    state = await (await fetch('/api/state')).json();
    render();
  } catch(e) { /* server 退出 */ }
  setTimeout(pollState, 1000);
}
async function pollLogs() {
  try {
    const d = await (await fetch('/api/logs?since=' + lastSeq)).json();
    lastSeq = d.seq;
    if (d.lines.length) {
      const el = $('log');
      el.textContent += d.lines.map(l => `[${l.time}] ${l.text}`).join('\n') + '\n';
      el.scrollTop = el.scrollHeight;
    }
  } catch(e) {}
  setTimeout(pollLogs, 900);
}

function setText(el, v) { const s = String(v); if (el.textContent !== s) el.textContent = s; }

function render() {
  $('ver').textContent = 'v' + state.version;
  // 凭证
  const c = state.creds;
  if (c && c.ok) {
    const html = `<span>凭证: 已从 Bambu Studio 读取 — 账号 <b>${esc(c.account)}</b>,
      区域 <b>${esc(c.region)}</b>,打印机 ${c.printers.length} 台</span>`;
    if ($('credInfo')._h !== html) { $('credInfo').innerHTML = html; $('credInfo')._h = html; }
    const sel = $('snSel');
    if (sel.dataset.v !== JSON.stringify(c.printers) + '|' + c.last_sn) {
      sel.dataset.v = JSON.stringify(c.printers) + '|' + c.last_sn;
      sel.innerHTML = c.printers.map(s =>
        `<option ${s === c.last_sn ? 'selected' : ''}>${s}</option>`).join('');
    }
  } else {
    const msg = `<span class="bad">凭证: ${esc((c && c.message) || '不可用')} → 可用局域网模式</span>`;
    if ($('credInfo')._h !== msg) { $('credInfo').innerHTML = msg; $('credInfo')._h = msg; }
  }
  // 连接状态(变化才写,避免打断自动化/减少重排)
  setText($('connState'), state.connected ? `已连接(${state.mode})目标: ${state.sn || '-'}` : '未连接');
  const connTxt = state.connected ? '断开' : '连接';
  if ($('btnConn').textContent !== connTxt) {
    $('btnConn').textContent = connTxt;
    $('btnConn').className = state.connected ? 'danger' : '';
  }
  // 状态
  const r = state.report || {};
  const g = r.gcode_state || '';
  setText($('s_state'), STATE_CN[g] || g || '-');
  setText($('s_task'), (r.subtask_name || '-'));
  setText($('s_layer'), fmtN(r.layer_num) + '/' + fmtN(r.total_layer_num));
  const pct = parseInt(r.print_percent);
  setText($('s_pct'), (pct >= 0 && pct <= 100) ? pct + '%' : '-');
  setText($('s_skip'), r.skip_objects || '-');
  setText($('s_tid'), r.task_id || '-');
  // 按钮
  const printing = g === 'RUNNING' || g === 'PAUSE';
  const wantFetch = !!(r.task_id && c && c.ok);
  if ($('btnFetch').disabled !== !wantFetch) $('btnFetch').disabled = !wantFetch;
  if ($('btnSkip').disabled !== !printing) $('btnSkip').disabled = !printing;
  if ($('btnManual').disabled !== !printing) $('btnManual').disabled = !printing;
  // 零件
  if (JSON.stringify(state.plates) !== render._pj) {
    render._pj = JSON.stringify(state.plates);
    state.plates.forEach(p => p.objects.forEach(o => { if (o.skipped) reported.add(o.identify_id); }));
    const ps = $('plateSel');
    ps.innerHTML = state.plates.map((p, i) =>
      `<option value="${i}">盘 ${p.index} ${esc(p.name)}(${p.objects.length} 零件)[${p.source}]</option>`).join('');
    if (state.plates.length) { curPlateIdx = null; renderPlate(); }
    else { $('objlist').innerHTML = '<div class="hint" style="padding:8px">尚未加载零件列表</div>'; clearCanvas(); }
  }
}

function renderPlate() {
  const i = parseInt($('plateSel').value || '0');
  curPlateIdx = isNaN(i) ? null : i;
  selected = new Set();
  lastClick = {};
  const pl = state.plates[curPlateIdx];
  const box = $('objlist');
  if (!pl) { box.innerHTML = ''; clearCanvas(); return; }
  box.innerHTML = pl.objects.map(o => {
    if (o.skipped) reported.add(o.identify_id);
    const dis = o.skipped ? 'disabled' : '';
    return `<label data-iid="${o.identify_id}" class="${o.skipped ? 'sel' : ''}">
      <input type="checkbox" data-iid="${o.identify_id}" ${o.skipped ? 'checked disabled' : ''}
             onchange="onListCheck(${o.identify_id}, this.checked)"> ${esc(o.label || objLabel(o))}</label>`;
  }).join('');
  showImg();
}
function objLabel(o) {
  return `#${o.identify_id}  ${o.name}` + (o.skipped ? '  [已跳过]' : '');
}
function onListCheck(iid, checked) {
  if (checked) selected.add(iid); else selected.delete(iid);
  const cb = document.querySelector(`.objlist input[data-iid="${iid}"]`);
  if (cb) cb.checked = checked;
  const lb = document.querySelector(`.objlist label[data-iid="${iid}"]`);
  if (lb) lb.classList.toggle('sel', checked);
  refreshMarks();
}
function setAll(v) {
  const pl = state.plates[curPlateIdx]; if (!pl) return;
  for (const o of pl.objects) {
    if (o.skipped) continue;
    if (v) selected.add(o.identify_id); else selected.delete(o.identify_id);
    const cb = document.querySelector(`.objlist input[data-iid="${o.identify_id}"]`);
    if (cb) cb.checked = v;
    const lb = document.querySelector(`.objlist label[data-iid="${o.identify_id}"]`);
    if (lb) lb.classList.toggle('sel', v);
  }
  refreshMarks();
}

// ---- 俯视图(点击像素 → identify_id,R + G<<8 + B<<16,逆向 b1v.i)----
const cv = $('plate'), ctx = cv.getContext('2d', {willReadFrequently: true});
let imgCache = {};

function clearCanvas() { ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, cv.width, cv.height); }

function showImg() {
  const pl = state.plates[curPlateIdx];
  clearCanvas();
  if (!pl) return;
  const view = document.querySelector('input[name=view]:checked').value;
  let k = view;
  if (k === 'pick' && !pl.has_pick) k = 'top';
  if ((k === 'pick' && !pl.has_pick) || (k === 'top' && !pl.has_top)) {
    ctx.fillStyle = '#888'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('无俯视图,可直接在右侧列表勾选', cv.width/2, cv.height/2);
    return;
  }
  const key = curPlateIdx + ':' + k;
  const img = new Image();
  img.onload = () => { imgCache[curPlateIdx + ':' + k] = img; drawToFit(img); refreshMarks(); };
  img.onerror = () => { ctx.fillStyle = '#888'; ctx.fillText('图片加载失败', cv.width/2, cv.height/2); };
  img.src = `/api/img?i=${pl.index}&k=${k}&v=${curPlateIdx}`;
}
function drawToFit(img) {
  const s = Math.min(cv.width / img.width, cv.height / img.height, 1);
  ctx.imageSmoothingEnabled = s < 1;
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
}
function refreshMarks() {
  // 重绘底图 + 标记
  const pl = state.plates[curPlateIdx]; if (!pl) return;
  const view = document.querySelector('input[name=view]:checked').value;
  let k = view;
  if (k === 'pick' && !pl.has_pick) k = 'top';
  const img = imgCache[curPlateIdx + ':' + k];
  if (img) drawToFit(img); else return;
  ctx.lineWidth = 3; ctx.font = 'bold 13px sans-serif';
  for (const [iid, pos] of Object.entries(lastClick)) {
    if (!selected.has(Number(iid))) continue;
    ctx.strokeStyle = '#00e676';
    ctx.beginPath(); ctx.arc(pos.x, pos.y, 16, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#00e676'; ctx.fillText('✓', pos.x - 5, pos.y + 5);
  }
}
cv.addEventListener('click', ev => {
  const pl = state.plates[curPlateIdx]; if (!pl) return;
  const rect = cv.getBoundingClientRect();
  const x = Math.floor(ev.clientX - rect.left), y = Math.floor(ev.clientY - rect.top);
  // 读点击像素;零件中心常有孔(黑),向四周螺旋搜索最近的有效遮罩色
  let iid = pxToId(x, y);
  if (!pl.objects.some(o => o.identify_id === iid || o.object_id === iid)) {
    const near = nearestMaskId(x, y, pl);
    if (near) iid = near;
  }
  const obj = pl.objects.find(o => o.identify_id === iid || o.object_id === iid);
  if (!obj || obj.skipped) return;                  // 空白/已跳过
  selected.has(iid) ? selected.delete(iid) : selected.add(iid);
  lastClick[iid] = {x, y};
  const cb = document.querySelector(`.objlist input[data-iid="${iid}"]`);
  if (cb) cb.checked = selected.has(iid);
  const lb = document.querySelector(`.objlist label[data-iid="${iid}"]`);
  if (lb) lb.classList.toggle('sel', selected.has(iid));
  refreshMarks();
});
function pxToId(x, y) {
  if (x < 0 || y < 0 || x >= cv.width || y >= cv.height) return 0;
  const d = ctx.getImageData(x, y, 1, 1).data;
  return d[0] + d[1] * 256 + d[2] * 65536;   // 遮罩颜色反解(黑=0 未命中)
}
function nearestMaskId(x, y, pl) {
  // 在半径 60px 内找最近的有效零件色像素(命中零件中心孔等镂空区域)
  const valid = new Set();
  for (const o of pl.objects) { valid.add(o.identify_id); valid.add(o.object_id); }
  for (let r = 4; r <= 60; r += 4) {
    let best = null, bestD = 1e9;
    for (let a = 0; a < 360; a += 6) {
      const nx = x + Math.round(r * Math.cos(a * Math.PI / 180));
      const ny = y + Math.round(r * Math.sin(a * Math.PI / 180));
      const id = pxToId(nx, ny);
      if (valid.has(id)) {
        const dd = (nx - x) ** 2 + (ny - y) ** 2;
        if (dd < bestD) { bestD = dd; best = id; }
      }
    }
    if (best) return best;
  }
  return 0;
}

// ---- 动作 ----
function mode() { return document.querySelector('input[name=mode]:checked').value; }
async function toggleConn() {
  if (state.connected) {
    await post('/api/disconnect');
  } else {
    try {
      await post('/api/connect', {mode: mode(), sn: $('snSel').value, ip: $('ip').value, code: $('code').value});
    } catch(e) { alert('连接失败: ' + e.message); }
  }
}
async function doFetch() {
  try { await post('/api/fetch'); } catch(e) { alert('获取失败: ' + e.message); }
}
$('f3mf').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/api/3mf', {method: 'POST', body: fd});
  if (!r.ok) alert('3mf 解析失败: ' + (await r.text()));
  ev.target.value = '';
});
async function sendSelected() {
  const pl = state.plates[curPlateIdx];
  const ids = [...selected].filter(iid => !(pl && pl.objects.find(o => o.identify_id === iid && o.skipped)));
  if (!ids.length) return alert('请先勾选/点选要跳过的零件');
  if (!confirm(`确认跳过零件: ${ids.join(', ')}?\n该操作不可撤销。`)) return;
  try { await post('/api/skip', {ids, legacy: $('legacy').checked}); }
  catch(e) { alert('发送失败: ' + e.message); }
}
async function sendManual() {
  const ids = $('manual').value.split(/[,\s]+/).map(Number).filter(n => n > 0);
  if (!ids.length) return alert('请输入对象 ID');
  if (!confirm(`确认跳过零件: ${ids.join(', ')}?\n该操作不可撤销。`)) return;
  try { await post('/api/skip', {ids, legacy: $('legacy').checked}); }
  catch(e) { alert('发送失败: ' + e.message); }
}

const STATE_CN = {IDLE:'空闲', RUNNING:'打印中', PAUSE:'已暂停', FINISH:'已完成',
  FAILED:'已失败', SLICING:'切片中', SYSLAYER:'首层扫描', PREPARE:'准备中',
  CHANGE_FILAMENT:'换料中', M600_PAUSE:'换料暂停', HAIR_LINE:'调平扫线', SKIRT:'打印裙边'};
const fmtN = v => (v === undefined || v === null || v === '') ? '-' : v;
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

pollState();
pollLogs();
</script>
</body>
</html>
